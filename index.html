<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pikachu Ngọc Hồi</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#5b21b6;--p2:#7c3aed;--bg:#f6f2ff;--card:#fff;--tx:#1e1033;--mu:#6b5b8a;--ln:#e4d9fb;--ok:#15803d;--er:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{background:linear-gradient(135deg,#3b0f8c,var(--p2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{width:48px;height:48px;border-radius:12px;background:#fff}
header h1{font-size:18px;margin:0;font-weight:800}header small{opacity:.85}
header button{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font-size:17px;margin:20px 0 8px;color:var(--p)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.er{color:var(--er)}
.me{background:#efe7ff;border-radius:8px;padding:6px 8px;margin:0 -8px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;font:inherit;background:#fff;margin:4px 0 10px}
label{font-weight:600;font-size:13px;color:var(--mu)}
button.pri{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;width:100%}
button.sm{background:var(--p2);color:#fff;border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px}
button.sm.g{background:#fff;color:var(--er);border:1px solid var(--er)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:30px;font-weight:800;color:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex}
nav a{flex:1;text-align:center;padding:10px 2px;color:var(--mu);text-decoration:none;font-size:11px;font-weight:600}
nav a.on{color:var(--p);box-shadow:inset 0 3px var(--p)}
.gh{width:100%;text-align:left;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;color:var(--tx);display:flex;justify-content:space-between;margin-top:8px}
.gh::after{content:'+';font-weight:800;color:var(--p)}
.gh[aria-expanded=true]{background:#efe7ff;color:var(--p);border-radius:12px 12px 0 0}
.gh[aria-expanded=true]::after{content:'–'}
.gb{display:none;background:#fff;border:1px solid var(--ln);border-top:0;border-radius:0 0 12px 12px;padding:6px 14px 10px}
.gb.open{display:block}.gb ol,.gb ul{margin:6px 0;padding-left:20px}.gb p{margin:6px 0}
.auth{max-width:380px;margin:30px auto;padding:0 14px}
:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
</style></head><body>
<div id="root"></div>
<script>
// ====== ĐIỀN THÔNG TIN SUPABASE CỦA BẠN (Project Settings > API) ======
const SB_URL='https://jbhjxavgefzjyrkectmy.supabase.co', SB_KEY='sb_publishable_nQT0aSZhg6GtV0exxKGuzA_qMghRrdl';
// ======================================================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GN={nam:'Nam',nu:'Nữ'},TY={mm:'Nam-Nam',mf:'Nam-Nữ',ff:'Nữ-Nữ'};
let session,me,P=[],M=[],C=[],tab='news',regMode=false;

const pn=id=>P.find(p=>p.id===id)?.full_name||'?';
const sorted=(g,k)=>P.filter(p=>!g||p.gender===g).sort((a,b)=>b[k]-a[k]);
const top3=g=>sorted(g,'elo_same').slice(0,3);
const nm=(p,bold)=>bold?`<b>${esc(p.full_name)}</b>`:esc(p.full_name);
const isTop=p=>top3(p.gender).some(x=>x.id===p.id);
const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)};
const conf=()=>M.filter(m=>m.status==='confirmed');
const monthM=()=>conf().filter(m=>new Date(m.confirmed_at)>=monthStart());
const inM=(m,id)=>[m.a1,m.a2,m.b1,m.b2].includes(id);
function monthDelta(){const d={};monthM().forEach(m=>{[m.a1,m.a2].forEach(i=>d[i]=(d[i]||0)+m.delta);[m.b1,m.b2].forEach(i=>d[i]=(d[i]||0)-m.delta)});return d}
const mline=m=>`${esc(pn(m.a1))} & ${esc(pn(m.a2))} <b>${m.score_a}-${m.score_b}</b> ${esc(pn(m.b1))} & ${esc(pn(m.b2))}`;

async function load(){
  P=(await sb.from('profiles').select('*')).data||[];
  M=(await sb.from('matches').select('*').order('created_at',{ascending:false}).limit(300)).data||[];
  C=(await sb.from('challenges').select('*').order('play_at',{ascending:false}).limit(200)).data||[];
  me=P.find(p=>p.id===session.user.id);
}
async function rpc(fn,args){const{error}=await sb.rpc(fn,args);if(error)alert(error.message);await load();render()}

function authView(){
  $('#root').innerHTML=`<div class="auth"><div style="text-align:center"><img src="logo.svg" width="96" style="border-radius:20px;border:1px solid var(--ln)"><h1 style="color:var(--p);margin:8px 0 0">Pikachu Ngọc Hồi</h1><p class="mu">Câu lạc bộ Pickleball</p></div>
  <div class="card"><form id="af">
  ${regMode?`<label>Họ tên</label><input name="n" required>
  <div class="two"><div><label>Giới tính</label><select name="g"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
  <div><label>Trình độ</label><select name="l"><option value="moi">Mới chơi</option><option value="tb" selected>Trung bình</option><option value="kha">Khá</option></select></div></div>`:''}
  <label>Email</label><input name="e" type="email" required>
  <label>Mật khẩu (từ 6 ký tự)</label><input name="p" type="password" minlength="6" required>
  <button class="pri">${regMode?'Đăng ký':'Đăng nhập'}</button></form>
  ${regMode?'':'<p class="mu" style="text-align:center;margin:12px 0 0"><a href="#" id="fp">Quên mật khẩu?</a></p>'}<p class="mu" style="text-align:center;margin:12px 0 0"><a href="#" id="sw">${regMode?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</a></p></div></div>`;
  if($('#fp'))$('#fp').onclick=async e=>{e.preventDefault();const m=$('#af').e.value.trim();if(!m)return alert('Nhập email vào ô Email trước.');
    const{error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});alert(error?error.message:'Đã gửi email đặt lại mật khẩu. Hãy kiểm tra hộp thư.')};
  $('#sw').onclick=e=>{e.preventDefault();regMode=!regMode;authView()};
  $('#af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const r=regMode?await sb.auth.signUp({email:f.e,password:f.p,options:{data:{full_name:f.n.trim(),gender:f.g,level:f.l}}}):await sb.auth.signInWithPassword({email:f.e,password:f.p});
    if(r.error)return alert(r.error.message);
    if(regMode&&!r.data.session)alert('Hãy mở email để xác nhận tài khoản, rồi đăng nhập.')};
}

const top3Html=g=>`<div class="card">${top3(g).map((p,i)=>`<div class="row ${p.id===me.id?'me':''}"><span>${i+1}. ${nm(p,p.id===me.id)}</span><span class="mu">${Math.round(p.elo_same)}</span></div>`).join('')||'<span class="mu">Chưa có dữ liệu</span>'}</div>`;

function news(){
  const d=monthDelta(),ch=Object.entries(d).filter(([,v])=>Math.abs(v)>=.5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3);
  return `<p class="mu" style="margin:0">${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
  <h2>Top 3 Nam</h2>${top3Html('nam')}<h2>Top 3 Nữ</h2>${top3Html('nu')}
  <h2>Biến động điểm trong tháng</h2><div class="card">${ch.map(([id,v])=>`<div class="row"><span>${esc(pn(id))}</span><b class="${v>0?'ok':'er'}">${v>0?'▲ +':'▼ '}${Math.round(v)}</b></div>`).join('')||'<span class="mu">Chưa có trận nào được xác nhận trong tháng này.</span>'}</div>
  <h2>Kết quả hôm nay</h2><div class="card">${conf().filter(m=>new Date(m.confirmed_at).toDateString()===new Date().toDateString()).map(m=>`<div class="row"><span>${mline(m)}</span><span class="mu">±${Math.round(Math.abs(m.delta))}</span></div>`).join('')||'<span class="mu">Hôm nay chưa có trận nào được xác nhận.</span>'}</div>
  <h2>Thách đấu hôm nay</h2><div class="card">${C.filter(c=>['open','accepted'].includes(c.status)&&new Date(c.play_at).toDateString()===new Date().toDateString()).reverse().map(c=>`<div class="row"><span>${cline(c)}</span><span class="mu">${new Date(c.play_at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})} · ${CS[c.status]}</span></div>`).join('')||'<span class="mu">Hôm nay chưa có thách đấu nào.</span>'}</div>`;
}


const CS={open:'Chờ nhận lời',accepted:'Đã nhận lời',declined:'Đã từ chối',cancelled:'Đã hủy'};
const ctime=c=>new Date(c.play_at).toLocaleString('vi-VN',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const cline=c=>`${[c.a1,c.a2].map(i=>i===me.id?`<b>${esc(pn(i))}</b>`:esc(pn(i))).join(' & ')} <span class="mu">thách</span> ${[c.b1,c.b2].map(i=>i===me.id?`<b>${esc(pn(i))}</b>`:esc(pn(i))).join(' & ')}`;
const gOf=i=>P.find(p=>p.id===i)?.gender;
const teamTy=(i,j)=>[gOf(i),gOf(j)].sort().join();
const inbox=()=>({m:M.filter(m=>m.status==='pending'&&(m.b1===me.id||m.b2===me.id)).length,c:C.filter(c=>c.status==='open'&&(c.b1===me.id||c.b2===me.id)).length});
function sugg(){
  const pool=P.filter(p=>p.id!==me.id),k=()=>'elo_same',r=(a,b)=>(a[k(a,b)]+b[k(a,b)])/2,ty=(a,b)=>[a.gender,b.gender].sort().join(),out=[];
  for(const p of pool){const A=ty(me,p),ra=r(me,p),rest=pool.filter(x=>x.id!==p.id),tb=Math.abs(me[k(me,p)]-p[k(me,p)])*.01;
    for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++){const x=rest[i],y=rest[j];if(ty(x,y)!==A)continue;
      out.push({d:Math.abs(ra-r(x,y)),s:Math.abs(ra-r(x,y))+tb,a:p.id,b:x.id,c:y.id})}}
  out.sort((u,v)=>u.s-v.s);const seen=new Set(),res=[];
  for(const o of out){const key=[o.b,o.c].sort().join();if(seen.has(key))continue;seen.add(key);res.push(o);if(res.length===3)break}
  return res;
}
function challengeView(){
  const others=P.filter(p=>p.id!==me.id),opt=`<option value="">— chọn —</option>`+others.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${GN[p.gender]})</option>`).join('');
  const inc=C.filter(c=>c.status==='open'&&(c.b1===me.id||c.b2===me.id));
  const mine=C.filter(c=>[c.a1,c.a2,c.b1,c.b2].includes(me.id)).slice(0,15);
  const sg=sugg();
  return `<h2>Lời thách đấu gửi đến bạn</h2><div class="card">${inc.map(c=>`<div class="row"><span>${cline(c)}<br><span class="mu">${ctime(c)}</span></span><span><button class="sm" data-acc="${c.id}">Nhận lời</button> <button class="sm g" data-dec="${c.id}">Từ chối</button></span></div>`).join('')||'<span class="mu">Chưa có lời thách đấu nào.</span>'}</div>
  <h2>Gợi ý trận cân tài cân sức</h2><div class="card">${sg.map(o=>`<div class="row"><span><b>Bạn</b> & ${esc(pn(o.a))} <span class="mu">vs</span> ${esc(pn(o.b))} & ${esc(pn(o.c))}<br><span class="mu">Chênh khoảng ${Math.round(o.d)} điểm</span></span><button class="sm" data-sug="${o.a},${o.b},${o.c}">Thách đấu</button></div>`).join('')||'<span class="mu">Cần thêm thành viên để gợi ý trận.</span>'}</div>
  <h2>Tạo thách đấu</h2><form class="card" id="cf" onsubmit="return false"><label>Đội của bạn: bạn và</label><select name="a2" required>${opt}</select>
  <label>Đội bị thách đấu</label><select name="b1" required>${opt}</select><select name="b2" required>${opt}</select>
  <label>Thời gian</label><input name="t" type="datetime-local" required><button class="pri">Gửi thách đấu</button></form>
  <h2>Thách đấu của bạn</h2><div class="card">${mine.map(c=>`<div class="row"><span>${cline(c)}<br><span class="mu">${ctime(c)} · ${CS[c.status]}</span></span>${c.created_by===me.id&&['open','accepted'].includes(c.status)?`<button class="sm g" data-cxc="${c.id}">Hủy</button>`:''}</div>`).join('')||'<span class="mu">Chưa có thách đấu.</span>'}</div>`;
}

function submitView(){
  const others=P.filter(p=>p.id!==me.id),opt=`<option value="">— chọn —</option>`+others.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${GN[p.gender]})</option>`).join('');
  const wait=M.filter(m=>m.status==='pending');
  const mine=wait.filter(m=>m.b1===me.id||m.b2===me.id),sent=wait.filter(m=>m.created_by===me.id);
  const adm=me.is_admin?`<h2>Quản trị: tất cả trận</h2><div class="card">${M.slice(0,40).map(m=>`<div class="row"><span>${mline(m)}<br><span class="mu">${TY[m.type]} · ${m.status}</span></span>${m.status==='cancelled'||m.status==='rejected'?'':`<span><button class="sm" data-set="${m.id}">Sửa</button> <button class="sm g" data-cx="${m.id}">Hủy</button></span>`}</div>`).join('')||'<span class="mu">Chưa có trận</span>'}</div>`:'';
  return `<h2>Chờ bạn xác nhận</h2><div class="card">${mine.map(m=>`<div class="row"><span>${mline(m)}<br><span class="mu">${TY[m.type]}</span></span><span><button class="sm" data-ok="${m.id}">Xác nhận</button> <button class="sm g" data-no="${m.id}">Từ chối</button></span></div>`).join('')||'<span class="mu">Không có trận nào cần xác nhận.</span>'}</div>
  ${sent.length?`<h2>Bạn đã nhập, đang chờ đối thủ</h2><div class="card">${sent.map(m=>`<div class="row"><span>${mline(m)}</span></div>`).join('')}</div>`:''}
  <h2>Nhập kết quả mới</h2><form class="card" id="mf"><label>Đội của bạn: bạn và</label><select name="a2" required>${opt}</select>
  <label>Đội đối thủ</label><select name="b1" required>${opt}</select><select name="b2" required>${opt}</select>
  <div class="two"><div><label>Điểm đội bạn</label><input name="sa" type="number" min="0" required></div><div><label>Điểm đối thủ</label><input name="sb" type="number" min="0" required></div></div>
  <button class="pri">Gửi kết quả</button></form>${adm}`;
}

function rankTable(title,list,key){
  return `<h2>${title}</h2><div class="card">${list.map((p,i)=>`<div class="row ${p.id===me.id?'me':''}"><span>${i+1}. ${nm(p,p.id===me.id||(key==='elo_same'&&isTop(p)))}</span><span class="mu">${Math.round(p[key])}</span></div>`).join('')}</div>`;
}
function meView(){
  const same=sorted(me.gender,'elo_same'),mm=monthM().filter(m=>inM(m,me.id)),rs=same.findIndex(p=>p.id===me.id)+1;
  const w=mm.filter(m=>(m.a1===me.id||m.a2===me.id)===(m.score_a>m.score_b)).length;
  return `<div class="card"><div style="font-size:18px">${nm(me,isTop(me))} ${me.is_admin?'<span class="mu">(admin)</span>':''}</div>
  <div class="two" style="margin-top:8px"><div><div class="big">#${rs}</div><span class="mu">Hạng ${GN[me.gender]} (trên ${same.length})</span></div>
  <div><div class="big">${Math.round(me.elo_same)}</div><span class="mu">Điểm hiện tại</span></div></div></div>
  <h2>Trận đã đánh tháng này (${mm.length}${mm.length?' · thắng '+w:''})</h2><div class="card">${mm.map(m=>`<div class="row"><span>${mline(m)}</span></div>`).join('')||'<span class="mu">Chưa có trận nào.</span>'}</div>
  ${rankTable('Bảng xếp hạng '+GN[me.gender],same,'elo_same')}
  <h2>Giải đấu đã đăng ký</h2><div class="card mu">Sẽ có ở giai đoạn 3.</div>
  <button class="pri" id="out" style="background:#fff;color:var(--p);border:1px solid var(--p)">Đăng xuất</button>`;
}
function members(){
  const n=P.filter(p=>p.gender==='nam').length,f=P.length-n;
  return `<div class="two"><div class="card"><div class="big">${n}</div>Nam</div><div class="card"><div class="big">${f}</div>Nữ</div></div>
  <div class="card">${P.map(p=>`<div class="row"><span>${nm(p,p.id===me.id)}</span><span class="mu">${GN[p.gender]}${p.is_admin?' · admin':''}</span></div>`).join('')}</div>`;
}

const GUIDE=[
['Đăng ký & đăng nhập',`<ol><li>Mở trang web, bấm <b>Chưa có tài khoản? Đăng ký</b>.</li><li>Điền họ tên, giới tính, trình độ, email và mật khẩu từ 6 ký tự trở lên.</li><li>Lần sau chỉ cần đăng nhập bằng email và mật khẩu đó.</li></ol><p>Hãy chọn đúng <b>giới tính</b> vì sau này không tự sửa được. Trình độ chỉ dùng để cấp điểm khởi đầu: Mới chơi 900, Trung bình 1000, Khá 1100. Sau đó điểm thay đổi theo kết quả thi đấu thực tế.</p>`],
['Trang Hot news',`<p>Đây là trang đầu tiên, gồm:</p><ul><li>Ngày hôm nay.</li><li>Top 3 Nam và Top 3 Nữ. Nếu tên bạn nằm trong Top 3 thì tên được in đậm.</li><li>Biến động điểm trong tháng: những người tăng hoặc giảm điểm nhiều nhất. Bảng này tự làm mới khi sang tháng.</li><li>Kết quả các trận đã xác nhận trong ngày, kèm số điểm thay đổi.</li><li>Các thách đấu diễn ra trong ngày.</li></ul>`],
['Nhập kết quả trận đấu',`<ol><li>Vào tab <b>Kết quả</b>, kéo xuống mục <b>Nhập kết quả mới</b>.</li><li>Chọn partner của bạn và hai đối thủ.</li><li>Nhập điểm của đội bạn và điểm của đối thủ (không được hòa).</li><li>Bấm <b>Gửi kết quả</b>.</li></ol><p>Hai đội phải cùng loại đôi: Nam-Nam, Nam-Nữ hoặc Nữ-Nữ. Điểm chỉ được tính sau khi đối thủ xác nhận.</p>`],
['Xác nhận kết quả',`<p>Khi ai đó nhập trận có tên bạn là đối thủ, tab <b>Kết quả</b> sẽ có chấm đỏ báo số trận cần xác nhận.</p><ul><li>Mở mục <b>Chờ bạn xác nhận</b>, kiểm tra tỷ số.</li><li>Đúng thì bấm <b>Xác nhận</b>. Chỉ cần một trong hai đối thủ xác nhận là đủ.</li><li>Sai thì bấm <b>Từ chối</b>, người nhập sẽ nhập lại.</li></ul><p>Nếu có tranh cãi hoặc nhập nhầm sau khi đã xác nhận, hãy nhờ admin sửa tỷ số hoặc hủy trận.</p>`],
['Cách tính điểm & xếp hạng',`<ul><li>Hệ thống dùng điểm Elo. Thắng đội mạnh hơn được cộng nhiều điểm hơn, thắng đội yếu hơn được cộng ít hơn.</li><li>Điểm của đội là trung bình điểm hai người.</li><li>Mỗi người chỉ có một điểm duy nhất. Mọi trận (Nam-Nam, Nam-Nữ, Nữ-Nữ) đều ảnh hưởng đến điểm này.</li><li>Xem bảng xếp hạng đầy đủ ở tab <b>Của tôi</b>.</li></ul>`],
['Thách đấu',`<ol><li>Vào tab <b>Thách đấu</b>, mục <b>Tạo thách đấu</b>.</li><li>Chọn partner, hai người của đội bị thách và thời gian.</li><li>Bấm <b>Gửi thách đấu</b>.</li></ol><p>Đội bị thách sẽ thấy lời thách ở đầu tab và bấm <b>Nhận lời</b> hoặc <b>Từ chối</b>. Người tạo có thể hủy khi cần. Thách đấu trong ngày sẽ hiện ở Hot news. Sau khi đánh xong, nhớ nhập kết quả ở tab <b>Kết quả</b>.</p>`],
['Gợi ý trận đấu',`<p>Ở tab <b>Thách đấu</b>, mục <b>Gợi ý trận cân tài cân sức</b> đưa ra 3 trận có điểm hai đội chênh nhau ít nhất. Bấm <b>Thách đấu</b> bên cạnh gợi ý để điền sẵn vào form, rồi chọn thời gian và gửi.</p>`],
['Trang Của tôi',`<ul><li>Thứ hạng và điểm hiện tại của bạn.</li><li>Số trận đã đánh trong tháng, kèm tỷ số từng trận.</li><li>Bảng xếp hạng đầy đủ của nhóm cùng giới với bạn, tên bạn được tô nổi.</li><li>Nút <b>Đăng xuất</b> ở cuối trang.</li></ul>`],
['Quên mật khẩu',`<ol><li>Ở trang đăng nhập, nhập email của bạn vào ô Email.</li><li>Bấm <b>Quên mật khẩu?</b>.</li><li>Mở email nhận được, bấm vào đường dẫn và nhập mật khẩu mới.</li></ol><p>Nếu không thấy email, hãy kiểm tra thư mục Spam hoặc chờ vài phút.</p>`],
['Giải đấu',`<p>Tính năng giải đấu (đăng ký giải, chia pot, bốc thăm) sẽ được bổ sung trong thời gian tới.</p>`]
];
function guideView(){
  return `<p class="mu" style="margin:0">Bấm vào từng mục để xem chi tiết.</p>`+GUIDE.map(([t,b])=>`<button class="gh" aria-expanded="false">${t}</button><div class="gb">${b}</div>`).join('');
}

const TABS={news:['Hot news',news],submit:['Nhập kết quả',submitView,'Kết quả'],challenge:['Thách đấu',challengeView],me:['Của tôi',meView],members:['Thành viên',members],guide:['Hướng dẫn sử dụng',guideView,'Hướng dẫn']};
function render(){
  if(!session)return authView();
  if(!me){$('#root').innerHTML='<div style="padding:20px"><p>Đang tải hồ sơ…</p><p class="mu">Nếu chờ quá lâu, tài khoản này chưa có hồ sơ. Hãy đăng xuất, xóa tài khoản trong Supabase rồi đăng ký lại.</p><button class="pri" id="out">Đăng xuất</button></div>';$('#out').onclick=()=>sb.auth.signOut();return}
  $('#root').innerHTML=`<header><img src="logo.svg" alt=""><div><h1>Pikachu Ngọc Hồi</h1><small>${TABS[tab][0]}</small></div></header>
  <main>${TABS[tab][1]()}</main><nav>${Object.entries(TABS).map(([k,v])=>`<a href="#${k}" class="${k===tab?'on':''}">${v[2]||v[0]}${(k==='submit'&&inbox().m)||(k==='challenge'&&inbox().c)?` <span style="background:var(--er);color:#fff;border-radius:9px;padding:0 6px">${k==='submit'?inbox().m:inbox().c}</span>`:''}</a>`).join('')}</nav>`;
  const id=s=>document.querySelector(`[data-${s}]`);
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>rpc('confirm_match',{p_id:b.dataset.ok}));
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>rpc('reject_match',{p_id:b.dataset.no}));
  document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>confirm('Hủy kết quả trận này?')&&rpc('admin_cancel_match',{p_id:b.dataset.cx}));
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const v=prompt('Tỷ số mới (đội A-đội B), ví dụ 11-8');const r=v&&v.match(/^(\d+)\D+(\d+)$/);r?rpc('admin_set_result',{p_id:b.dataset.set,p_sa:+r[1],p_sb:+r[2]}):0});
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>rpc('respond_challenge',{p_id:b.dataset.acc,p_accept:true}));
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>rpc('respond_challenge',{p_id:b.dataset.dec,p_accept:false}));
  document.querySelectorAll('[data-cxc]').forEach(b=>b.onclick=()=>confirm('Hủy thách đấu này?')&&rpc('cancel_challenge',{p_id:b.dataset.cxc}));
  document.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const[a,x,y]=b.dataset.sug.split(',');const f=$('#cf');f.a2.value=a;f.b1.value=x;f.b2.value=y;f.scrollIntoView({behavior:'smooth'})});
  if($('#cf'))$('#cf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),ids=[me.id,f.a2,f.b1,f.b2];
    if(new Set(ids).size<4)return alert('Cần 4 người chơi khác nhau.');
    if(teamTy(me.id,f.a2)!==teamTy(f.b1,f.b2))return alert('Hai đội phải cùng loại đôi (Nam-Nam, Nam-Nữ hoặc Nữ-Nữ).');
    if(new Date(f.t)<new Date())return alert('Hãy chọn thời gian trong tương lai.');
    const{error}=await sb.from('challenges').insert({created_by:me.id,a1:me.id,a2:f.a2,b1:f.b1,b2:f.b2,play_at:new Date(f.t).toISOString()});
    if(error)return alert(error.message);alert('Đã gửi thách đấu.');await load();render()};
  document.querySelectorAll('.gh').forEach(b=>b.onclick=()=>{const was=b.getAttribute('aria-expanded')==='true';document.querySelectorAll('.gh').forEach(x=>{x.setAttribute('aria-expanded','false');x.nextElementSibling.classList.remove('open')});if(!was){b.setAttribute('aria-expanded','true');b.nextElementSibling.classList.add('open')}});
  if($('#out'))$('#out').onclick=()=>sb.auth.signOut();
  if($('#mf'))$('#mf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),g=i=>P.find(p=>p.id===i)?.gender,ids=[me.id,f.a2,f.b1,f.b2];
    if(new Set(ids).size<4)return alert('Cần 4 người chơi khác nhau.');
    const A=[g(me.id),g(f.a2)].sort().join(),B=[g(f.b1),g(f.b2)].sort().join();
    if(A!==B)return alert('Hai đội phải cùng loại đôi (Nam-Nam, Nam-Nữ hoặc Nữ-Nữ).');
    if(+f.sa===+f.sb)return alert('Tỷ số không được hòa.');
    const type=A==='nam,nam'?'mm':A==='nu,nu'?'ff':'mf';
    const{error}=await sb.from('matches').insert({type,a1:me.id,a2:f.a2,b1:f.b1,b2:f.b2,score_a:+f.sa,score_b:+f.sb,created_by:me.id});
    if(error)return alert(error.message);alert('Đã gửi. Một trong hai đối thủ cần xác nhận.');await load();render()};
}
function route(){const t=location.hash.slice(1);tab=TABS[t]?t:'news';render()}
window.onhashchange=route;
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(async()=>{const p=prompt('Nhập mật khẩu mới (từ 6 ký tự):');if(p&&p.length>=6){const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Đã đổi mật khẩu.')}else if(p)alert('Mật khẩu cần từ 6 ký tự.')},300);if(s&&me&&me.id===s.user.id){session=s;return}session=s;me=null;route();if(s)setTimeout(async()=>{await load();route()},0)});
</script></body></html>
